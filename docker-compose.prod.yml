# VPS deployment.
#
# DATABASE_URL points at a managed Postgres (Neon), so there is no
# postgres service here — see docker-compose.selfhosted.yml if you ever
# want to run the database on the box instead.
#
# Note there is no ${VAR} interpolation anywhere below. Compose expands
# those at parse time from the shell or from a file named exactly `.env`
# — NOT from `env_file:`, which only populates a container's own
# environment. Mixing the two silently yields blank values: that is how
# the postgres service ended up starting with no password and failing
# its healthcheck. Everything here reads its configuration from
# .env.production inside the container, where it actually belongs.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env.production
    # $$ escapes the $ so Compose leaves it alone and the container's own
    # shell expands REDIS_PASSWORD from env_file at runtime.
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - cadence_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending schema migrations once per deploy, before anything
  # serves traffic. Without this the schema only ever reached production
  # by someone remembering to run `prisma db push` by hand.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env.production
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    ports:
      # Loopback only: Apache terminates TLS and proxies to this.
      # Publishing 0.0.0.0 would leave the app reachable over plain HTTP,
      # bypassing the vhost and its certificate.
      # Host port is 3001 because another app already holds 3000 on this
      # VPS — change the left-hand number if that ever moves.
      - "127.0.0.1:3001:3000"
    volumes:
      # Fallback media store, used only when the CLOUDINARY_* variables
      # are absent. Keeps uploads off the container filesystem either way.
      - cadence_media:/app/var/media
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - cadence_media:/app/var/media
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  cadence_redis_data:
  cadence_media:
