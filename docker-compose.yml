# Local development: just the stateful services.
# Run `npm run dev` and `npm run worker:dev` against these on your machine.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence_dev_password
      POSTGRES_DB: cadence
    ports:
      - "5432:5432"
    volumes:
      - cadence_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cadence_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cadence_postgres_data:
  cadence_redis_data:
